[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/util"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/edfloreshz/devmode"

[workspace.dependencies]
dm-core = { path = "crates/core" }
dm-util = { path = "crates/util" }
clap = { version = "4.5", features = ["derive", "cargo"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
git2 = "0.20"
git2_credentials = "0.15"
git-url-parse = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
colored = "3.0"
inquire = "0.7"
