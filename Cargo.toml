[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/tui", "crates/ui", "crates/util"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/edfloreshz/devmode"

[workspace.dependencies]
dm-core = { path = "crates/core" }
dm-util = { path = "crates/util" }
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
git2 = "0.20"
git2_credentials = { version = "0.15", default-features = false }
git-url-parse = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.0"
colored = "3.0"
inquire = "0.7"
ratatui = "0.29"
crossterm = "0.28"
fuzzy-matcher = "0.3"
tui-input = "0.11"
# `smol` selects the async backend that provides `iced::time::every`; the
# default `thread-pool` backend has no timer support.
iced = { version = "0.14", features = ["smol"] }
iced_test = "0.14"
# Default features (`xdg-portal`, `wayland`) give Linux the native
# xdg-desktop-portal file chooser instead of a GTK dialog; macOS and
# Windows use their native pickers regardless.
rfd = "0.17"
