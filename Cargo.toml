[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/tui", "crates/ui", "crates/util"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/edfloreshz/devmode"
authors = ["Eduardo Flores <edfloreshz@gmail.com>"]
description = "A project management utility for developers."
homepage = "https://github.com/edfloreshz/devmode"
documentation = "https://github.com/edfloreshz/devmode"
keywords = ["project", "management", "cli", "tui", "ui"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[workspace.lints.clippy]
# `dm_core::Error` carries `toml::de::Error`, which pushes the enum past the
# lint's 128-byte threshold on some targets (Windows).
result_large_err = "allow"

[workspace.dependencies]
dm-core = { path = "crates/core", version = "0.5.0" }
dm-util = { path = "crates/util", version = "0.5.0" }
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
directories = "6.0"
git2 = "0.21"
git2_credentials = { version = "0.16", default-features = false }
git-url-parse = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.0"
colored = "3.0"
inquire = "0.9"
ratatui = "0.30"
crossterm = "0.29"
fuzzy-matcher = "0.3"
tui-input = "0.15"
iced = { version = "0.14", features = ["smol", "image"] }
iced_test = "0.14"
rfd = "0.17"
notify-debouncer-mini = "0.7"
open = "5.4"
