name: Flatpak

on:
  push:
    branches: [main, rewrite]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'assets/**'
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'assets/**'
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Builds the manifest as committed: the working tree is copied in and
      # cargo fetches crates over the network (the manifest allows this for
      # non-Flathub builds). This checks the manifest, desktop file, metainfo,
      # and that the app actually compiles inside the runtime.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: devmode.flatpak
          manifest-path: packaging/flatpak/dev.edfloreshz.Devmode.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate --strict --explain \
            packaging/flatpak/dev.edfloreshz.Devmode.metainfo.xml
